name: Manim examples
on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Native text and rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - name: Optional TeX backend on Python 3.13
        if: matrix.python == '3.13'
        run: sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm
      - run: uv sync --locked --extra typst
      - run: uv run python -m unittest discover -s tests -v
      - name: Render examples
        run: |
          if [ "${{ matrix.python }}" = "3.13" ]; then
            uv run python scripts/smoke.py --include-typst --include-tex
          else
            uv run python scripts/smoke.py --include-typst
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-evidence-python-${{ matrix.python }}
          path: verification/
